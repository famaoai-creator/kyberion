name: Cross-OS Smoke

env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  # Fail Vitest runs that write into live active/ state (tests/vitest-active-leak-guard.ts).
  KYBERION_TEST_LEAK_STRICT: '1'

# Phase B-2: ensure Kyberion's core build + representative contract scenarios pass on all supported OSes.
# This closes the gap where one platform can drift while the other keeps passing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly to catch ecosystem drift (Node minor releases, OS package changes).
    - cron: '0 4 * * 1'

# A newer push to the same PR supersedes the running checks; main pushes and
# scheduled runs are never cancelled (contract: operations-hygiene runbook §CI).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-smoke:
    permissions:
      contents: read
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}${{ matrix.os != 'windows-latest' && format(' / shard {0}/{1}', matrix.shard, matrix.total) || '' }}
    runs-on: ${{ matrix.os }}
    # The Unix core suite takes ~21 minutes on macOS; build, follow-up smoke
    # checks, and post-job cache save push the full job past 30 minutes.
    # Keep enough headroom for those steps on the slowest hosted runner.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [24]
        shard: [1, 2, 3]
        total: [3]
        exclude:
          - os: windows-latest
            shard: 2
          - os: windows-latest
            shard: 3
    steps:
      - uses: actions/checkout@v5

      # GitHub's macOS runner SQLite may not include the FTS5 extension used by
      # the history search index. SQLite is keg-only in Homebrew, so add its
      # bin directory explicitly instead of relying on brew link.
      - name: Install SQLite with FTS5 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install sqlite
          sqlite_bin="$(brew --prefix sqlite)/bin"
          echo "$sqlite_bin" >> "$GITHUB_PATH"
          "$sqlite_bin/sqlite3" --version
          "$sqlite_bin/sqlite3" ':memory:' 'pragma compile_options;' | grep -qx 'ENABLE_FTS5'

      # The native PDF engine embeds a CJK subset font; macOS ships Hiragino,
      # Linux runners need Noto CJK installed for parity.
      - name: Install CJK fonts (Linux)
        if: runner.os == 'Linux'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          for source in /etc/apt/sources.list.d/*azure* /etc/apt/sources.list.d/*microsoft*; do
            if [ -f "$source" ]; then sudo mv "$source" "$source.disabled"; fi
          done
          # GitHub hosted images may leave Ubuntu sources pointed at the Azure
          # mirror inside ubuntu.sources; that mirror can stall package downloads.
          for source in /etc/apt/sources.list /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ]; then sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$source"; fi
          done
          if [ -r /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc ]; then
            echo "CJK font already available; skipping package installation."
            exit 0
          fi
          for attempt in 1 2 3; do
            if sudo timeout --signal=TERM 300s apt-get \
              -o Acquire::ForceIPv4=true \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              -o Acquire::http::Pipeline-Depth=0 \
              -o DPkg::Lock::Timeout=60 update; then
              break
            fi
            if [ "$attempt" = "3" ]; then exit 1; fi
            echo "::warning::apt-get update attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done
          for attempt in 1 2 3; do
            if sudo timeout --signal=TERM 300s apt-get \
              -o Acquire::ForceIPv4=true \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              -o Acquire::http::Pipeline-Depth=0 \
              -o DPkg::Lock::Timeout=60 install -y --no-install-recommends fonts-noto-cjk; then
              break
            fi
            if [ "$attempt" = "3" ]; then exit 1; fi
            echo "::warning::apt-get install attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done

      - name: Setup Kyberion
        uses: ./.github/actions/setup-kyberion
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build
        run: pnpm run build

      - name: Type check
        run: pnpm run typecheck

      - name: Contract schemas
        run: pnpm run check -- --scope full --only contract-schemas

      # The full core suite is still Unix-oriented: it relies on POSIX path
      # assertions and host-only fixtures (sqlite3, ffmpeg, and macOS/Linux
      # media backends). Keep that coverage on the Unix runners and exercise
      # the Windows-native surface with its platform-focused suite below.
      - name: Unit tests (core, shard ${{ matrix.shard }}/${{ matrix.total }})
        env:
          KYBERION_PERSONA: worker
          MISSION_ROLE: mission_controller
        # On pull requests pr-validation.yml runs the Linux core shards; this
        # workflow adds the macOS coverage only.
        if: runner.os != 'Windows' && !(runner.os == 'Linux' && github.event_name == 'pull_request')
        run: pnpm test -- --suite core --shard=${{ matrix.shard }}/${{ matrix.total }}

      - name: Unit tests (Windows native)
        if: runner.os == 'Windows'
        run: >-
          pnpm exec vitest run
          libs/core/windows-local-assist-bridge.test.ts
          libs/core/media/native-speech-listen-bridge.test.ts
          libs/core/media/native-tts.test.ts
          libs/core/environment-capability.test.ts
          libs/core/platform.test.ts
          libs/core/virtual/os-accessibility-detector.test.ts
          libs/core/windows-os-automation.test.ts

      # Live UI Automation smoke: launches Notepad and a WPF window on the
      # runner's interactive desktop, focuses them and checks that
      # os_accessibility finds their controls in the foreground window, then
      # clicks the WPF OK button through its Set-of-Marks mark with the
      # DPI-aware Windows pointer path and checks the click registered.
      - name: UI Automation live smoke (Windows)
        if: runner.os == 'Windows'
        # Three cases with bounded launch/availability deadlines (240 s each worst case).
        timeout-minutes: 18
        env:
          KYBERION_UIA_LIVE_SMOKE: '1'
          KYBERION_PERSONA: worker
          MISSION_ROLE: mission_controller
        run: pnpm exec vitest run libs/core/virtual/os-accessibility-detector.live.test.ts

      - name: Governance boundary tests
        # pr-validation.yml test-extra runs these on Linux for pull requests.
        if: runner.os != 'Windows' && !(runner.os == 'Linux' && github.event_name == 'pull_request')
        run: pnpm exec vitest run tests/foundation-io-boundary.test.ts tests/core-fs-exception-boundary.test.ts tests/process-boundary-governance.test.ts tests/runtime-child-process-boundary.test.ts

      - name: Meeting participation dry-run
        if: runner.os != 'Windows'
        run: pnpm test -- --suite meeting-dry-run

      - name: Pipeline preview (baseline)
        if: runner.os != 'Windows'
        run: pnpm run kyberion -- preview pipelines/baseline-check.json

      - name: Pipeline preview (meeting proxy)
        if: runner.os != 'Windows'
        run: pnpm run kyberion -- preview pipelines/meeting-proxy-workflow.json

      - name: Pipeline shell independence
        if: runner.os != 'Windows'
        run: pnpm run check -- --scope full --only pipeline-shell-independence

      - name: Customer aggregation smoke
        if: runner.os != 'Windows'
        env:
          KYBERION_CUSTOMER: smoke-test
          KYBERION_PERSONA: ecosystem_architect
          MISSION_ROLE: mission_controller
        run: |
          # Verify customer overlay path resolution doesn't panic on either OS.
          node -e "
          const r = require('./dist/libs/core/customer-resolver.js');
          if (!r.activeCustomer({ KYBERION_CUSTOMER: 'smoke-test' })) {
            console.error('customer resolver failed to detect active slug');
            process.exit(1);
          }
          console.log('customer resolver OK');
          "

      - name: Contract semver baseline check
        run: pnpm run check:contract-semver
