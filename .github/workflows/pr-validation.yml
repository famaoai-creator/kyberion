name: PR Validation

env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  # Fail Vitest runs that write into live active/ state (tests/vitest-active-leak-guard.ts).
  KYBERION_TEST_LEAK_STRICT: '1'

on:
  pull_request:
    branches: [main, develop]
  # Merge-queue readiness: these are the required PR checks, so they must
  # also report on merge_group events (the queue itself is a repository
  # setting). PR-only steps (title check, PR comment) skip there.
  merge_group:

# A newer push to the same PR supersedes the running checks; main pushes and
# scheduled runs are never cancelled (contract: operations-hygiene runbook §CI).
# merge_group runs get a unique gh-readonly-queue ref and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Single build for the run: downstream jobs download the owned compiler
  # outputs (scripts/build-output-layout.ts) instead of rebuilding (~4min
  # each). UI bundles (.next) stay out — too large and not needed here.
  build-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Setup Kyberion
        uses: ./.github/actions/setup-kyberion
        with:
          node-version: '24'
      - name: Build project
        run: pnpm run build
      - name: Upload compiler outputs
        uses: actions/upload-artifact@v6
        with:
          name: build-outputs
          retention-days: 1
          if-no-files-found: warn
          path: |
            dist/
            libs/core/dist/
            libs/shared-*/dist/
            presence/displays/terminal-hud/dist/
            plugins/dist/
            satellites/*/dist/
            knowledge/_integrity-manifest.json

  gates:
    name: pr-gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-artifacts
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - name: Setup Kyberion
        uses: ./.github/actions/setup-kyberion
        with:
          node-version: '24'
      - name: Download compiler outputs
        uses: actions/download-artifact@v6
        with:
          name: build-outputs
      - name: Run manifest-driven PR checks
        shell: bash
        run: pnpm run check -- --scope pr 2>&1 | tee -a "$RUNNER_TEMP/kyberion-ci-output.log"

      # Classify the captured output and print the next command per failure
      # (operations-hygiene runbook §1 "CI failure triage").
      - name: Triage failure
        if: failure()
        uses: ./.github/actions/ci-failure-triage
        with:
          job: pr-gates

  static:
    name: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-artifacts
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Setup Kyberion
        uses: ./.github/actions/setup-kyberion
        with:
          node-version: '24'
      # The checks below run even when an earlier one failed (`!cancelled()`),
      # so one push reports title, type, lint and format failures together.
      # The job still fails when any of them fails.
      - name: Download compiler outputs
        id: workspace
        uses: actions/download-artifact@v6
        with:
          name: build-outputs
      - name: Check PR title
        # merge_group events carry no pull_request payload; the title was
        # already checked on the PR.
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' && github.event_name == 'pull_request' }}
        # Pass the title through env: interpolating it into the script would let
        # a crafted PR title run shell commands.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: pnpm run check:pr-title -- --title "$PR_TITLE"
      - name: Type check
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        shell: bash
        run: pnpm run typecheck 2>&1 | tee -a "$RUNNER_TEMP/kyberion-ci-output.log"
      - name: Lint check
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        shell: bash
        run: pnpm run lint 2>&1 | tee -a "$RUNNER_TEMP/kyberion-ci-output.log"
      - name: Format check
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        run: pnpm exec prettier --check package.json .github/workflows/ci.yml .github/workflows/pr-validation.yml .github/workflows/release.yml .github/workflows/cross-os.yml .github/actions/setup-kyberion/action.yml

      # Classify the captured output and print the next command per failure
      # (operations-hygiene runbook §1 "CI failure triage").
      - name: Triage failure
        if: failure()
        uses: ./.github/actions/ci-failure-triage
        with:
          job: static-checks

  test-core:
    name: core-tests (shard ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: build-artifacts
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
        total: [6]
    steps:
      - uses: actions/checkout@v5

      # Native PDF engine CJK embedding test needs a CJK font on Linux
      - name: Install CJK fonts
        run: |
          export DEBIAN_FRONTEND=noninteractive
          for source in /etc/apt/sources.list.d/*azure* /etc/apt/sources.list.d/*microsoft*; do
            if [ -f "$source" ]; then sudo mv "$source" "$source.disabled"; fi
          done
          # GitHub hosted images may leave Ubuntu sources pointed at the Azure
          # mirror inside ubuntu.sources; that mirror can stall package downloads.
          for source in /etc/apt/sources.list /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ]; then sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$source"; fi
          done
          if [ -r /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc ]; then
            echo "CJK font already available; skipping package installation."
            exit 0
          fi
          for attempt in 1 2 3; do
            if sudo timeout --signal=TERM 300s apt-get \
              -o Acquire::ForceIPv4=true \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              -o Acquire::http::Pipeline-Depth=0 \
              -o DPkg::Lock::Timeout=60 update; then
              break
            fi
            if [ "$attempt" = "3" ]; then exit 1; fi
            echo "::warning::apt-get update attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done
          for attempt in 1 2 3; do
            if sudo timeout --signal=TERM 300s apt-get \
              -o Acquire::ForceIPv4=true \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              -o Acquire::http::Pipeline-Depth=0 \
              -o DPkg::Lock::Timeout=60 install -y --no-install-recommends fonts-noto-cjk; then
              break
            fi
            if [ "$attempt" = "3" ]; then exit 1; fi
            echo "::warning::apt-get install attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done

      - name: Setup Kyberion
        uses: ./.github/actions/setup-kyberion
        with:
          node-version: '24'
      - name: Download compiler outputs
        uses: actions/download-artifact@v6
        with:
          name: build-outputs

      - name: Run core tests (shard ${{ matrix.shard }}/${{ matrix.total }})
        env:
          KYBERION_PERSONA: worker
          MISSION_ROLE: mission_controller
        shell: bash
        run: pnpm test -- --suite core --shard=${{ matrix.shard }}/${{ matrix.total }} 2>&1 | tee -a "$RUNNER_TEMP/kyberion-ci-output.log"

      # Classify the captured output and print the next command per failure
      # (operations-hygiene runbook §1 "CI failure triage").
      - name: Triage failure
        if: failure()
        uses: ./.github/actions/ci-failure-triage
        with:
          job: core-tests (shard ${{ matrix.shard }}/${{ matrix.total }})

  test-extra:
    name: actuator/boundary/security tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-artifacts
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Setup Kyberion
        uses: ./.github/actions/setup-kyberion
        with:
          node-version: '24'
      - name: Download compiler outputs
        id: workspace
        uses: actions/download-artifact@v6
        with:
          name: build-outputs

      - name: Run actuator tests
        shell: bash
        run: pnpm test -- --suite actuators 2>&1 | tee -a "$RUNNER_TEMP/kyberion-ci-output.log"

      - name: Run governance boundary tests
        # Independent of the actuator suite: report both in one round.
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        shell: bash
        run: pnpm exec vitest run tests/foundation-io-boundary.test.ts tests/core-fs-exception-boundary.test.ts tests/process-boundary-governance.test.ts tests/runtime-child-process-boundary.test.ts 2>&1 | tee -a "$RUNNER_TEMP/kyberion-ci-output.log"

      # Runs after the suites above so it sees anything they left behind: a
      # test that writes into active/missions/ instead of a uniquely named
      # directory under sharedTmp() leaves a state-less mission directory that
      # no lifecycle verb can see. CI starts with an empty tree, so any residue
      # here was created by this run.
      - name: Check mission tree residue
        run: pnpm run mission:residue --check

      - name: Security scan
        run: pnpm audit --audit-level=moderate
        continue-on-error: true

      # Classify the captured output and print the next command per failure
      # (operations-hygiene runbook §1 "CI failure triage").
      - name: Triage failure
        if: failure()
        uses: ./.github/actions/ci-failure-triage
        with:
          job: actuator/boundary/security tests

  vital:
    name: vital-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-artifacts
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - name: Setup Kyberion
        uses: ./.github/actions/setup-kyberion
        with:
          node-version: '24'
      - name: Download compiler outputs
        uses: actions/download-artifact@v6
        with:
          name: build-outputs

      - name: Vital check
        id: build-size
        run: |
          node dist/scripts/vital_check.js --format text --exit-on-missing=false > vital-check-report.md
          node dist/scripts/vital_check.js --format json --exit-on-missing=false > vital-check-report.json
          cat vital-check-report.md

      # One sticky comment per PR, found by a hidden marker: created on the
      # first run, edited when the report changes, untouched otherwise (the
      # report used to be re-posted as a new comment on every push).
      - name: Comment vital check report on PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');

            if (!fs.existsSync('vital-check-report.md')) {
              core.info('Vital check report not found, skipping comment');
              return;
            }

            const MARKER = '<!-- kyberion:vital-check-report -->';
            const report = fs.readFileSync('vital-check-report.md', 'utf8').trim();
            const body = `${MARKER}\n### 🩺 Vital Check Report\n\n${report}\n`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const fromActions = comments.filter(
              (comment) => comment.user?.login === 'github-actions[bot]'
            );
            // Prefer the marked comment; otherwise adopt the newest legacy
            // (unmarked) report so existing PRs converge on one comment.
            const existing =
              fromActions.find((comment) => (comment.body ?? '').includes(MARKER)) ??
              fromActions
                .filter((comment) => /Physical Foundation:/.test(comment.body ?? '') && /^Overall: /m.test(comment.body ?? ''))
                .pop();

            if (!existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              core.info('Created vital check comment');
            } else if ((existing.body ?? '').trim() === body.trim()) {
              core.info(`Vital check comment ${existing.id} is unchanged; not updating`);
            } else {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated vital check comment ${existing.id}`);
            }

      - name: Upload vital check artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vital-check-reports
          path: |
            vital-check-report.md
            vital-check-report.json
            active/shared/logs/traces/traces-*.jsonl
          retention-days: 30
