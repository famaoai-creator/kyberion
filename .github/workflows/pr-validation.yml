name: PR Validation

env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'

on:
  pull_request:
    branches: [main, develop]

jobs:
  gates:
    name: pr-gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Kyberion
        uses: ./.github/actions/setup-kyberion
        with:
          node-version: '24'
      - name: Build @agent/core
        run: pnpm --filter '@agent/core' build
      - name: Build project
        run: pnpm run build
      - name: Run manifest-driven PR checks
        run: pnpm run check -- --scope pr

  static:
    name: static-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup Kyberion
        uses: ./.github/actions/setup-kyberion
        with:
          node-version: '24'
      - name: Build @agent/core
        run: pnpm --filter '@agent/core' build
      - name: Build project
        run: pnpm run build
      - name: Check PR title
        run: pnpm run check:pr-title -- --title "${{ github.event.pull_request.title }}"
      - name: Type check
        run: pnpm run typecheck
      - name: Lint check
        run: pnpm run lint
      - name: Format check
        run: pnpm exec prettier --check package.json .github/workflows/ci.yml .github/workflows/pr-validation.yml .github/workflows/release.yml .github/workflows/cross-os.yml .github/actions/setup-kyberion/action.yml

  test-core:
    name: core-tests (shard ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total: [4]
    steps:
      - uses: actions/checkout@v4

      # Native PDF engine CJK embedding test needs a CJK font on Linux
      - name: Install CJK fonts
        run: |
          export DEBIAN_FRONTEND=noninteractive
          for source in /etc/apt/sources.list.d/*azure* /etc/apt/sources.list.d/*microsoft*; do
            if [ -f "$source" ]; then sudo mv "$source" "$source.disabled"; fi
          done
          for attempt in 1 2 3; do
            if sudo timeout --signal=TERM 300s apt-get \
              -o Acquire::ForceIPv4=true \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              -o Acquire::http::Pipeline-Depth=0 \
              -o DPkg::Lock::Timeout=60 update -qq; then
              break
            fi
            if [ "$attempt" = "3" ]; then exit 1; fi
            echo "::warning::apt-get update attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done
          for attempt in 1 2 3; do
            if sudo timeout --signal=TERM 300s apt-get \
              -o Acquire::ForceIPv4=true \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              -o Acquire::http::Pipeline-Depth=0 \
              -o DPkg::Lock::Timeout=60 install -y -qq fonts-noto-cjk; then
              break
            fi
            if [ "$attempt" = "3" ]; then exit 1; fi
            echo "::warning::apt-get install attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done

      - name: Setup Kyberion
        uses: ./.github/actions/setup-kyberion
        with:
          node-version: '24'
      - name: Build @agent/core
        run: pnpm --filter '@agent/core' build
      - name: Build project
        run: pnpm run build

      - name: Run core tests (shard ${{ matrix.shard }}/${{ matrix.total }})
        env:
          KYBERION_PERSONA: worker
          MISSION_ROLE: mission_controller
        run: pnpm test -- --suite core --shard=${{ matrix.shard }}/${{ matrix.total }}

  test-extra:
    name: actuator/boundary/security tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup Kyberion
        uses: ./.github/actions/setup-kyberion
        with:
          node-version: '24'
      - name: Build @agent/core
        run: pnpm --filter '@agent/core' build
      - name: Build project
        run: pnpm run build

      - name: Run actuator tests
        run: pnpm test -- --suite actuators

      - name: Run governance boundary tests
        run: pnpm exec vitest run tests/foundation-io-boundary.test.ts tests/core-fs-exception-boundary.test.ts tests/process-boundary-governance.test.ts tests/runtime-child-process-boundary.test.ts

      - name: Security scan
        run: pnpm audit --audit-level=moderate
        continue-on-error: true

  vital:
    name: vital-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Kyberion
        uses: ./.github/actions/setup-kyberion
        with:
          node-version: '24'
      - name: Build @agent/core
        run: pnpm --filter '@agent/core' build
      - name: Build project
        run: pnpm run build

      - name: Vital check
        id: build-size
        run: |
          node dist/scripts/vital_check.js --format text --exit-on-missing=false > vital-check-report.md
          node dist/scripts/vital_check.js --format json --exit-on-missing=false > vital-check-report.json
          cat vital-check-report.md

      - name: Comment vital check report on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Check if report file exists
            if (!fs.existsSync('vital-check-report.md')) {
              console.log('Vital check report not found, skipping comment');
              return;
            }

            const report = fs.readFileSync('vital-check-report.md', 'utf8');

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('🩺 Vital Check Report')
            );

            const commentBody = report;

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
              console.log('Updated existing vital check comment');
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
              console.log('Created new vital check comment');
            }

      - name: Upload vital check artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vital-check-reports
          path: |
            vital-check-report.md
            vital-check-report.json
            active/shared/logs/traces/traces-*.jsonl
          retention-days: 30
