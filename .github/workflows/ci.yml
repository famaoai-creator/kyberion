name: CI

env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  # Fail Vitest runs that write into live active/ state (tests/vitest-active-leak-guard.ts).
  KYBERION_TEST_LEAK_STRICT: '1'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: read

# A newer push to the same PR supersedes the running checks; main pushes and
# scheduled runs are never cancelled (contract: operations-hygiene runbook §CI).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Kyberion
        uses: ./.github/actions/setup-kyberion
        with:
          node-version: ${{ matrix.node-version }}
          install-playwright: 'true'

      - name: Build project
        run: pnpm run build

      # PI-12: prove the source distribution is self-contained in a clean
      # governed staging directory and publish a checksum downstream can pin.
      - name: Verify source archive and clean install
        run: |
          pnpm run release:source-archive -- --ref "${GITHUB_SHA}" --output active/shared/exports/ci/kyberion-source.tar.gz
          pnpm run release:source-archive -- --check --output active/shared/exports/ci/kyberion-source.tar.gz
          pnpm kyberion release install-smoke --ref "${GITHUB_SHA}"
      - name: Upload source archive evidence
        uses: actions/upload-artifact@v6
        with:
          name: kyberion-source-archive
          path: |
            active/shared/exports/ci/kyberion-source.tar.gz
            active/shared/exports/ci/SHA256SUMS
          if-no-files-found: error

      - name: Run manifest-driven full checks
        env:
          # The tenant-registry gate verifies the personal-tier tenant spine.
          # Give the governed checker its read authority explicitly instead of
          # relying on a developer shell's ambient role.
          KYBERION_PERSONA: worker
          MISSION_ROLE: mission_controller
        run: pnpm run check -- --scope full

      # After build: the checker imports @agent/core, which resolves to the
      # package dist. Running it pre-build broke every main push since the
      # step was introduced (ERR_MODULE_NOT_FOUND).
      - name: Check commit subject
        if: github.event_name == 'push'
        run: pnpm run check:commit-subject

      - name: Lint check
        # pr-validation.yml static-checks owns this on pull requests.
        if: github.event_name != 'pull_request'
        run: pnpm run lint

      - name: Format check
        # pr-validation.yml static-checks owns this on pull requests.
        if: github.event_name != 'pull_request'
        run: pnpm exec prettier --check package.json .github/workflows/ci.yml .github/workflows/pr-validation.yml .github/workflows/release.yml .github/workflows/cross-os.yml .github/actions/setup-kyberion/action.yml

      - name: TypeScript type check
        # pr-validation.yml static-checks owns this on pull requests.
        if: github.event_name != 'pull_request'
        run: pnpm run typecheck

      - name: Validate capability discovery
        run: node dist/scripts/capability_discovery.js > /dev/null

      - name: Validate surface runtime contract
        run: node dist/scripts/surface_runtime.js --action status > /dev/null

      - name: Verify no build artifacts in source control
        run: |
          STALE=$(git diff --name-only -- 'libs/' 'presence/displays/' 'satellites/' | grep -E '\.(js|js\.map|d\.ts|d\.ts\.map)$' | head -5)
          if [ -n "$STALE" ]; then
            echo "::error::Build artifacts detected in source tree: $STALE"
            exit 1
          fi
          # Compiled shadows committed next to .ts sources shadow the module
          # at runtime and pollute boundary baselines (2026-07-08 incident).
          SHADOWS=$(git ls-files '*.js' '*.js.map' '*.d.ts' | grep -Ev '^(dist|docs|tools|knowledge|plugins)/' | while read -r f; do
            base="$f"
            case "$f" in
              *.d.ts.map) base="${f%.d.ts.map}" ;;
              *.d.ts) base="${f%.d.ts}" ;;
              *.js.map) base="${f%.js.map}" ;;
              *.js) base="${f%.js}" ;;
            esac
            if [ -f "${base}.ts" ] || [ -f "${base}.tsx" ]; then echo "$f"; fi
          done | head -10)
          if [ -n "$SHADOWS" ]; then
            echo "::error::Compiled artifacts shadow TypeScript sources: $SHADOWS"
            exit 1
          fi

  first-win-clean-clone:
    runs-on: ubuntu-latest
    needs: lint-and-validate
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Setup Kyberion
        uses: ./.github/actions/setup-kyberion
        with:
          node-version: '24'
          # pipelines/verify-session.json starts with browser:goto — the
          # first-win sequence needs the Chromium runtime (was provisioned
          # for every job before the setup-action consolidation).
          install-playwright: 'true'

      - name: Build clean checkout
        run: pnpm build

      - name: Run documented first-win sequence
        run: |
          pnpm env:bootstrap --manifest kyberion-toolchain
          pnpm kyberion doctor
          pnpm pipeline --input pipelines/verify-session.json
          test -s active/shared/tmp/first-win-session.png

      - name: Validate first-win contract
        run: pnpm run check -- --scope full --only first-win-docs

      - name: Validate first-win artifact contract
        run: pnpm run check -- --scope full --only first-win-smoke

      # PE-02: the Chronos plugin host, a sandboxed-iframe plugin view and an
      # approved human action end to end in Chromium, against a hermetic root
      # under active/shared/tmp/ (reuses this job's build and Chromium). RA-03:
      # runs twice by default — Chronos started directly and with the
      # surface_runtime env (SYSTEM_ROLE=chronos_mirror_v2) — ~11 s each, ~25 s.
      - name: Plugin views E2E
        timeout-minutes: 5
        run: pnpm kyberion check plugin-views-e2e

  intent-smoke:
    runs-on: ubuntu-latest
    needs: lint-and-validate
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Setup Kyberion
        uses: ./.github/actions/setup-kyberion
        with:
          node-version: '24'

      - name: Build project
        run: pnpm run build

      - name: Run lightweight intent smoke suite
        run: pnpm kyberion smoke intent --output active/shared/tmp/intent-smoke

      - name: Upload intent smoke logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: intent-smoke-logs
          path: active/shared/tmp/intent-smoke
          retention-days: 14

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [lint-and-validate, intent-smoke]
    strategy:
      fail-fast: false
      matrix:
        test-suite: [smoke, core, actuators, scripts, integration]
        include:
          - test-suite: smoke
            command: pnpm run test
          - test-suite: core
            command: pnpm test -- --suite core --coverage
            pr-duplicate: true
          - test-suite: actuators
            command: pnpm test -- --suite actuators
            pr-duplicate: true
          - test-suite: scripts
            command: pnpm test -- --suite scripts
          - test-suite: integration
            command: pnpm test -- --suite integration
    steps:
      # core and actuators run in pr-validation.yml on pull requests; keep the
      # job (and its check name) but skip the duplicate work there.
      - name: Skip suite already covered by pr-validation
        if: ${{ github.event_name == 'pull_request' && matrix.pr-duplicate }}
        run: echo "::notice::${{ matrix.test-suite }} runs in pr-validation.yml on pull requests"

      - uses: actions/checkout@v5
        if: ${{ !(github.event_name == 'pull_request' && matrix.pr-duplicate) }}

      # Native PDF engine CJK embedding test needs a CJK font on Linux
      - name: Install CJK fonts
        if: ${{ !(github.event_name == 'pull_request' && matrix.pr-duplicate) }}
        run: |
          export DEBIAN_FRONTEND=noninteractive
          for source in /etc/apt/sources.list.d/*azure* /etc/apt/sources.list.d/*microsoft*; do
            if [ -f "$source" ]; then sudo mv "$source" "$source.disabled"; fi
          done
          # GitHub hosted images may leave Ubuntu sources pointed at the Azure
          # mirror inside ubuntu.sources; that mirror can stall package downloads.
          for source in /etc/apt/sources.list /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ]; then sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$source"; fi
          done
          if [ -r /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc ]; then
            echo "CJK font already available; skipping package installation."
            exit 0
          fi
          for attempt in 1 2 3; do
            if sudo timeout --signal=TERM 300s apt-get \
              -o Acquire::ForceIPv4=true \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              -o Acquire::http::Pipeline-Depth=0 \
              -o DPkg::Lock::Timeout=60 update; then
              break
            fi
            if [ "$attempt" = "3" ]; then exit 1; fi
            echo "::warning::apt-get update attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done
          for attempt in 1 2 3; do
            if sudo timeout --signal=TERM 300s apt-get \
              -o Acquire::ForceIPv4=true \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              -o Acquire::http::Pipeline-Depth=0 \
              -o DPkg::Lock::Timeout=60 install -y --no-install-recommends fonts-noto-cjk; then
              break
            fi
            if [ "$attempt" = "3" ]; then exit 1; fi
            echo "::warning::apt-get install attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done

      - name: Setup Kyberion
        if: ${{ !(github.event_name == 'pull_request' && matrix.pr-duplicate) }}
        uses: ./.github/actions/setup-kyberion
        with:
          node-version: '24'

      - name: Build project
        if: ${{ !(github.event_name == 'pull_request' && matrix.pr-duplicate) }}
        run: pnpm run build

      - name: Run ${{ matrix.test-suite }} tests
        if: ${{ !(github.event_name == 'pull_request' && matrix.pr-duplicate) }}
        continue-on-error: ${{ matrix.experimental == true }}
        env:
          KYBERION_PERSONA: ${{ matrix.test-suite == 'core' && 'worker' || '' }}
          MISSION_ROLE: ${{ matrix.test-suite == 'core' && 'mission_controller' || '' }}
        run: ${{ matrix.command }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        if: ${{ (matrix.test-suite == 'core' && always()) && !(github.event_name == 'pull_request' && matrix.pr-duplicate) }}
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Setup Kyberion
        uses: ./.github/actions/setup-kyberion
        with:
          node-version: '24'

      - name: Build project
        run: pnpm run build

      - name: Security audit (blocking on critical)
        # pnpm 11 uses npm's supported bulk advisory endpoint.
        # Do not fail the build when the registry returns a transient/malformed response.
        run: pnpm audit --audit-level=critical --ignore-registry-errors

      - name: Vital check audit
        run: node dist/scripts/vital_check.js --format json --exit-on-missing=false > /tmp/vital-check-report.json
