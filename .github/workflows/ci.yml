name: CI

env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  # Fail Vitest runs that write into live active/ state (tests/vitest-active-leak-guard.ts).
  KYBERION_TEST_LEAK_STRICT: '1'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Merge-queue readiness: required checks must also report on merge_group
  # events, otherwise a queued PR waits forever. Enabling the queue is a
  # repository setting (see .github/workflows/README.md).
  merge_group:
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: read

# A newer push to the same PR supersedes the running checks; main pushes and
# scheduled runs are never cancelled (contract: operations-hygiene runbook §CI).
# merge_group runs get a unique gh-readonly-queue ref and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Single build for the run: every downstream job downloads the owned
  # compiler outputs (declared in scripts/build-output-layout.ts) instead of
  # re-running the ~4min pnpm build per job. UI bundles (.next) stay out —
  # they are too large and only surface checks need them.
  build-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Setup Kyberion
        uses: ./.github/actions/setup-kyberion
        with:
          node-version: '24'

      - name: Build project
        run: pnpm run build

      - name: Upload compiler outputs
        uses: actions/upload-artifact@v6
        with:
          name: build-outputs
          retention-days: 1
          if-no-files-found: warn
          path: |
            dist/
            libs/core/dist/
            libs/shared-*/dist/
            presence/displays/terminal-hud/dist/
            plugins/dist/
            satellites/*/dist/
            knowledge/_integrity-manifest.json

  lint-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-artifacts
    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Kyberion
        uses: ./.github/actions/setup-kyberion
        with:
          node-version: ${{ matrix.node-version }}
          install-playwright: 'true'

      # Every check step below runs even when an earlier check failed
      # (`!cancelled()`), so one push reports every failing signal instead of
      # stopping at the first red step. They only require the prepared
      # workspace: this step succeeding implies checkout + setup succeeded.
      # The job still fails when any step fails.
      - name: Download compiler outputs
        id: workspace
        uses: actions/download-artifact@v6
        with:
          name: build-outputs

      # chronos-dom-contrast starts `next start` — the .next bundles are
      # deliberately excluded from the shared artifact (multi-GB), so this
      # job builds the UI locally (~1min vs ~4min for the full build).
      - name: Build UI for surface-dependent gates
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        run: pnpm run build:ui

      # PI-12: prove the source distribution is self-contained in a clean
      # governed staging directory and publish a checksum downstream can pin.
      - name: Verify source archive and clean install
        id: source-archive
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        run: |
          pnpm run release:source-archive -- --ref "${GITHUB_SHA}" --output active/shared/exports/ci/kyberion-source.tar.gz
          pnpm run release:source-archive -- --check --output active/shared/exports/ci/kyberion-source.tar.gz
          pnpm kyberion release install-smoke --ref "${GITHUB_SHA}"
      - name: Upload source archive evidence
        if: ${{ !cancelled() && steps.source-archive.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: kyberion-source-archive
          path: |
            active/shared/exports/ci/kyberion-source.tar.gz
            active/shared/exports/ci/SHA256SUMS
          if-no-files-found: error

      - name: Run manifest-driven full checks
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        env:
          # The tenant-registry gate verifies the personal-tier tenant spine.
          # Give the governed checker its read authority explicitly instead of
          # relying on a developer shell's ambient role.
          KYBERION_PERSONA: worker
          MISSION_ROLE: mission_controller
        shell: bash
        run: pnpm run check -- --scope full 2>&1 | tee -a "$RUNNER_TEMP/kyberion-ci-output.log"

      # After build: the checker imports @agent/core, which resolves to the
      # package dist. Running it pre-build broke every main push since the
      # step was introduced (ERR_MODULE_NOT_FOUND).
      - name: Check commit subject
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' && github.event_name == 'push' }}
        run: pnpm run check:commit-subject

      - name: Lint check
        # pr-validation.yml static-checks owns this on pull requests and merge_group.
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' && github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
        run: pnpm run lint

      - name: Format check
        # pr-validation.yml static-checks owns this on pull requests and merge_group.
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' && github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
        run: pnpm exec prettier --check package.json .github/workflows/ci.yml .github/workflows/pr-validation.yml .github/workflows/release.yml .github/workflows/cross-os.yml .github/actions/setup-kyberion/action.yml

      - name: TypeScript type check
        # pr-validation.yml static-checks owns this on pull requests and merge_group.
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' && github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
        shell: bash
        run: pnpm run typecheck 2>&1 | tee -a "$RUNNER_TEMP/kyberion-ci-output.log"

      - name: Validate capability discovery
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        run: node dist/scripts/capability_discovery.js > /dev/null

      - name: Validate surface runtime contract
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        run: node dist/scripts/surface_runtime.js --action status > /dev/null

      - name: Verify no build artifacts shadow source
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        run: |
          CHANGED=$(git diff --name-only -- 'libs/' 'presence/displays/' 'satellites/')
          STALE=$(printf '%s\n' "$CHANGED" | grep -E '\.(js|js\.map|d\.ts|d\.ts\.map)$' | head -5 || true)
          if [ -n "$STALE" ]; then
            echo "::error::Build artifacts changed tracked source files: $STALE"
            exit 1
          fi
          node --import ./scripts/ts-loader.mjs scripts/check_source_shadows.ts

      # Classify the captured output and print the next command per failure
      # (operations-hygiene runbook §1 "CI failure triage").
      - name: Triage failure
        if: failure()
        uses: ./.github/actions/ci-failure-triage
        with:
          job: lint-and-validate

  # Independent of lint-and-validate (S4): a red lint/gate step must not skip
  # the clean-clone, intent-smoke or test signals — every job reports in one
  # round. This job builds its own clean checkout, so it needs nothing.
  first-win-clean-clone:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Setup Kyberion
        uses: ./.github/actions/setup-kyberion
        with:
          node-version: '24'
          # pipelines/verify-session.json starts with browser:goto — the
          # first-win sequence needs the Chromium runtime (was provisioned
          # for every job before the setup-action consolidation).
          install-playwright: 'true'

      - name: Build clean checkout
        run: pnpm build

      - name: Run documented first-win sequence
        run: |
          pnpm env:bootstrap --manifest kyberion-toolchain
          pnpm kyberion doctor
          pnpm pipeline --input pipelines/verify-session.json
          test -s active/shared/tmp/first-win-session.png

      - name: Validate first-win contract
        run: pnpm run check -- --scope full --only first-win-docs

      - name: Validate first-win artifact contract
        run: pnpm run check -- --scope full --only first-win-smoke

      # PE-02: the Chronos plugin host, a sandboxed-iframe plugin view and an
      # approved human action end to end in Chromium, against a hermetic root
      # under active/shared/tmp/ (reuses this job's build and Chromium). RA-03:
      # runs twice by default — Chronos started directly and with the
      # surface_runtime env (SYSTEM_ROLE=chronos_mirror_v2) — ~11 s each, ~25 s.
      - name: Plugin views E2E
        timeout-minutes: 5
        run: pnpm kyberion check plugin-views-e2e

  intent-smoke:
    runs-on: ubuntu-latest
    needs: build-artifacts
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Setup Kyberion
        uses: ./.github/actions/setup-kyberion
        with:
          node-version: '24'

      - name: Download compiler outputs
        uses: actions/download-artifact@v6
        with:
          name: build-outputs

      - name: Run lightweight intent smoke suite
        run: pnpm kyberion smoke intent --output active/shared/tmp/intent-smoke

      - name: Upload intent smoke logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: intent-smoke-logs
          path: active/shared/tmp/intent-smoke
          retention-days: 14

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build-artifacts
    strategy:
      fail-fast: false
      matrix:
        test-suite: [smoke, core, actuators]
        include:
          - test-suite: smoke
            command: pnpm run test
          - test-suite: core
            command: pnpm test -- --suite core --coverage
            pr-duplicate: true
          - test-suite: actuators
            command: pnpm test -- --suite actuators
            pr-duplicate: true
          # scripts was the longest suite (~11min) — shard it 3-ways so the
          # per-PR tail drops to ~4min. `shard` stays unset for single jobs.
          - test-suite: scripts
            shard: '1/3'
            command: pnpm test -- --suite scripts --shard=1/3
          - test-suite: scripts
            shard: '2/3'
            command: pnpm test -- --suite scripts --shard=2/3
          - test-suite: scripts
            shard: '3/3'
            command: pnpm test -- --suite scripts --shard=3/3
          - test-suite: integration
            shard: '1/2'
            command: pnpm test -- --suite integration --shard=1/2
          - test-suite: integration
            shard: '2/2'
            command: pnpm test -- --suite integration --shard=2/2
    steps:
      # core and actuators run in pr-validation.yml on pull requests and in the
      # merge queue; keep the job (and its check name) but skip the duplicate
      # work there.
      - name: Skip suite already covered by pr-validation
        if: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && matrix.pr-duplicate }}
        run: echo "::notice::${{ matrix.test-suite }} runs in pr-validation.yml on pull requests"

      - uses: actions/checkout@v5
        if: ${{ !((github.event_name == 'pull_request' || github.event_name == 'merge_group') && matrix.pr-duplicate) }}

      # Native PDF engine CJK embedding test needs a CJK font on Linux
      - name: Install CJK fonts
        if: ${{ !((github.event_name == 'pull_request' || github.event_name == 'merge_group') && matrix.pr-duplicate) }}
        run: |
          export DEBIAN_FRONTEND=noninteractive
          for source in /etc/apt/sources.list.d/*azure* /etc/apt/sources.list.d/*microsoft*; do
            if [ -f "$source" ]; then sudo mv "$source" "$source.disabled"; fi
          done
          # GitHub hosted images may leave Ubuntu sources pointed at the Azure
          # mirror inside ubuntu.sources; that mirror can stall package downloads.
          for source in /etc/apt/sources.list /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ]; then sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$source"; fi
          done
          if [ -r /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc ]; then
            echo "CJK font already available; skipping package installation."
            exit 0
          fi
          for attempt in 1 2 3; do
            if sudo timeout --signal=TERM 300s apt-get \
              -o Acquire::ForceIPv4=true \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              -o Acquire::http::Pipeline-Depth=0 \
              -o DPkg::Lock::Timeout=60 update; then
              break
            fi
            if [ "$attempt" = "3" ]; then exit 1; fi
            echo "::warning::apt-get update attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done
          for attempt in 1 2 3; do
            if sudo timeout --signal=TERM 300s apt-get \
              -o Acquire::ForceIPv4=true \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              -o Acquire::http::Pipeline-Depth=0 \
              -o DPkg::Lock::Timeout=60 install -y --no-install-recommends fonts-noto-cjk; then
              break
            fi
            if [ "$attempt" = "3" ]; then exit 1; fi
            echo "::warning::apt-get install attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done

      - name: Setup Kyberion
        if: ${{ !((github.event_name == 'pull_request' || github.event_name == 'merge_group') && matrix.pr-duplicate) }}
        uses: ./.github/actions/setup-kyberion
        with:
          node-version: '24'

      - name: Download compiler outputs
        if: ${{ !((github.event_name == 'pull_request' || github.event_name == 'merge_group') && matrix.pr-duplicate) }}
        uses: actions/download-artifact@v6
        with:
          name: build-outputs

      - name: Run ${{ matrix.test-suite }} tests
        if: ${{ !((github.event_name == 'pull_request' || github.event_name == 'merge_group') && matrix.pr-duplicate) }}
        continue-on-error: ${{ matrix.experimental == true }}
        env:
          KYBERION_PERSONA: ${{ matrix.test-suite == 'core' && 'worker' || '' }}
          MISSION_ROLE: ${{ matrix.test-suite == 'core' && 'mission_controller' || '' }}
        shell: bash
        run: ${{ matrix.command }} 2>&1 | tee -a "$RUNNER_TEMP/kyberion-ci-output.log"

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        if: ${{ (matrix.test-suite == 'core' && always()) && !((github.event_name == 'pull_request' || github.event_name == 'merge_group') && matrix.pr-duplicate) }}
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      # Classify the captured output and print the next command per failure
      # (operations-hygiene runbook §1 "CI failure triage").
      - name: Triage failure
        if: failure()
        uses: ./.github/actions/ci-failure-triage
        with:
          job: test (${{ matrix.test-suite }}${{ matrix.shard && format(', {0}', matrix.shard) || '' }})

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-artifacts
    steps:
      - uses: actions/checkout@v5

      - name: Setup Kyberion
        uses: ./.github/actions/setup-kyberion
        with:
          node-version: '24'

      - name: Download compiler outputs
        uses: actions/download-artifact@v6
        with:
          name: build-outputs

      - name: Security audit (blocking on critical)
        # pnpm 11 uses npm's supported bulk advisory endpoint.
        # Do not fail the build when the registry returns a transient/malformed response.
        run: pnpm audit --audit-level=critical --ignore-registry-errors

      - name: Vital check audit
        run: node dist/scripts/vital_check.js --format json --exit-on-missing=false > /tmp/vital-check-report.json
