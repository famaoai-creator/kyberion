name: CI

env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
    steps:
      - name: Setup Kyberion
        uses: ./.github/actions/setup-kyberion
        with:
          node-version: ${{ matrix.node-version }}
          install-playwright: 'true'

      - name: Build project
        run: pnpm run build

      # PI-12: prove the source distribution is self-contained in a clean
      # governed staging directory and publish a checksum downstream can pin.
      - name: Verify source archive and clean install
        run: |
          pnpm run release:source-archive -- --ref "${GITHUB_SHA}" --output active/shared/exports/ci/kyberion-source.tar.gz
          pnpm run release:source-archive -- --check --output active/shared/exports/ci/kyberion-source.tar.gz
          pnpm kyberion release install-smoke --ref "${GITHUB_SHA}"
      - name: Upload source archive evidence
        uses: actions/upload-artifact@v4
        with:
          name: kyberion-source-archive
          path: |
            active/shared/exports/ci/kyberion-source.tar.gz
            active/shared/exports/ci/SHA256SUMS
          if-no-files-found: error

      - name: Run manifest-driven full checks
        env:
          # The tenant-registry gate verifies the personal-tier tenant spine.
          # Give the governed checker its read authority explicitly instead of
          # relying on a developer shell's ambient role.
          KYBERION_PERSONA: worker
          MISSION_ROLE: mission_controller
        run: pnpm run check -- --scope full

      # After build: the checker imports @agent/core, which resolves to the
      # package dist. Running it pre-build broke every main push since the
      # step was introduced (ERR_MODULE_NOT_FOUND).
      - name: Check commit subject
        if: github.event_name == 'push'
        run: pnpm run check:commit-subject

      - name: Lint check
        run: pnpm run lint

      - name: Format check
        run: pnpm exec prettier --check package.json .github/workflows/ci.yml .github/workflows/pr-validation.yml .github/workflows/release.yml .github/workflows/cross-os.yml .github/actions/setup-kyberion/action.yml

      - name: TypeScript type check
        run: pnpm run typecheck

      - name: Validate capability discovery
        run: node dist/scripts/capability_discovery.js > /dev/null

      - name: Validate surface runtime contract
        run: node dist/scripts/surface_runtime.js --action status > /dev/null

      - name: Verify no build artifacts in source control
        run: |
          STALE=$(git diff --name-only -- 'libs/' 'presence/displays/' 'satellites/' | grep -E '\.(js|js\.map|d\.ts|d\.ts\.map)$' | head -5)
          if [ -n "$STALE" ]; then
            echo "::error::Build artifacts detected in source tree: $STALE"
            exit 1
          fi
          # Compiled shadows committed next to .ts sources shadow the module
          # at runtime and pollute boundary baselines (2026-07-08 incident).
          SHADOWS=$(git ls-files '*.js' '*.js.map' '*.d.ts' | grep -Ev '^(dist|docs|tools|knowledge|plugins)/' | while read -r f; do
            base="$f"
            case "$f" in
              *.d.ts.map) base="${f%.d.ts.map}" ;;
              *.d.ts) base="${f%.d.ts}" ;;
              *.js.map) base="${f%.js.map}" ;;
              *.js) base="${f%.js}" ;;
            esac
            if [ -f "${base}.ts" ] || [ -f "${base}.tsx" ]; then echo "$f"; fi
          done | head -10)
          if [ -n "$SHADOWS" ]; then
            echo "::error::Compiled artifacts shadow TypeScript sources: $SHADOWS"
            exit 1
          fi

  first-win-clean-clone:
    runs-on: ubuntu-latest
    needs: lint-and-validate
    timeout-minutes: 20
    steps:
      - name: Setup Kyberion
        uses: ./.github/actions/setup-kyberion
        with:
          node-version: '24'

      - name: Build clean checkout
        run: pnpm build

      - name: Run documented first-win sequence
        run: |
          pnpm env:bootstrap --manifest kyberion-toolchain
          pnpm doctor
          pnpm pipeline --input pipelines/verify-session.json
          test -s active/shared/tmp/first-win-session.png

      - name: Validate first-win contract
        run: pnpm run check -- --scope full --only first-win-docs

      - name: Validate first-win artifact contract
        run: pnpm run check -- --scope full --only first-win-smoke

  intent-smoke:
    runs-on: ubuntu-latest
    needs: lint-and-validate
    timeout-minutes: 20
    steps:
      - name: Setup Kyberion
        uses: ./.github/actions/setup-kyberion
        with:
          node-version: '24'

      - name: Build project
        run: pnpm run build

      - name: Run lightweight intent smoke suite
        run: pnpm kyberion smoke intent --output active/shared/tmp/intent-smoke

      - name: Upload intent smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intent-smoke-logs
          path: active/shared/tmp/intent-smoke
          retention-days: 14

  test:
    runs-on: ubuntu-latest
    needs: [lint-and-validate, intent-smoke]
    strategy:
      fail-fast: false
      matrix:
        test-suite: [smoke, core, actuators, scripts, integration]
        include:
          - test-suite: smoke
            command: pnpm run test
          - test-suite: core
            command: pnpm test -- --suite core --coverage
          - test-suite: actuators
            command: pnpm test -- --suite actuators
          - test-suite: scripts
            command: pnpm test -- --suite scripts
          - test-suite: integration
            command: pnpm test -- --suite integration
    steps:
      # Native PDF engine CJK embedding test needs a CJK font on Linux
      - name: Install CJK fonts
        run: |
          export DEBIAN_FRONTEND=noninteractive
          for source in /etc/apt/sources.list.d/*azure* /etc/apt/sources.list.d/*microsoft*; do
            if [ -f "$source" ]; then sudo mv "$source" "$source.disabled"; fi
          done
          sudo timeout --signal=TERM 600s apt-get \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o DPkg::Lock::Timeout=60 update -qq
          sudo timeout --signal=TERM 600s apt-get \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o DPkg::Lock::Timeout=60 install -y -qq fonts-noto-cjk

      - name: Setup Kyberion
        uses: ./.github/actions/setup-kyberion
        with:
          node-version: '24'

      - name: Build project
        run: pnpm run build

      - name: Run ${{ matrix.test-suite }} tests
        continue-on-error: ${{ matrix.experimental == true }}
        env:
          KYBERION_PERSONA: ${{ matrix.test-suite == 'core' && 'worker' || '' }}
          MISSION_ROLE: ${{ matrix.test-suite == 'core' && 'mission_controller' || '' }}
        run: ${{ matrix.command }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: matrix.test-suite == 'core' && always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Kyberion
        uses: ./.github/actions/setup-kyberion
        with:
          node-version: '24'

      - name: Build project
        run: pnpm run build

      - name: Security audit (blocking on critical)
        # pnpm 11 uses npm's supported bulk advisory endpoint.
        # Do not fail the build when the registry returns a transient/malformed response.
        run: pnpm audit --audit-level=critical --ignore-registry-errors

      - name: Vital check audit
        run: node dist/scripts/vital_check.js --format json --exit-on-missing=false > /tmp/vital-check-report.json
