name: Release

env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup Kyberion
        uses: ./.github/actions/setup-kyberion
        with:
          node-version: 24

      - name: Build project
        run: pnpm run build

      - name: Validate release surface
        run: pnpm run validate

      - name: Run manifest-driven release checks
        run: pnpm run check -- --scope release

      - name: Build and verify source distribution
        run: |
          pnpm run release:source-archive -- --ref "${GITHUB_SHA}" --output "active/shared/exports/release/kyberion-${GITHUB_REF_NAME}.tar.gz"
          pnpm run release:source-archive -- --check --output "active/shared/exports/release/kyberion-${GITHUB_REF_NAME}.tar.gz"
          pnpm kyberion release install-smoke --ref "${GITHUB_SHA}"

      - name: Run full test suite
        run: pnpm exec vitest run

      - name: Extract release notes from changelog
        run: pnpm run release:notes -- --ref "${{ github.ref_name }}" --output active/shared/tmp/release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-file active/shared/tmp/release-notes.md active/shared/exports/release/kyberion-${{ github.ref_name }}.tar.gz active/shared/exports/release/SHA256SUMS
