<div class="kb-page-header__actions ps-header-controls">
  <label class="ps-header-control">
    <span class="ps-header-control__label">{{t:presence_studio:shell_theme}}</span>
    <select class="kb-input kb-select ps-header-control__select" data-front-desk-theme>
      <option value="system">{{t:presence_studio:shell_theme_system}}</option>
      <option value="light">{{t:presence_studio:shell_theme_light}}</option>
      <option value="dark">{{t:presence_studio:shell_theme_dark}}</option>
    </select>
  </label>
  <label class="ps-header-control">
    <span class="ps-header-control__label">{{t:presence_studio:shell_language}}</span>
    <select class="kb-input kb-select ps-header-control__select" data-front-desk-locale>
      <option value="ja" lang="ja">{{t:presence_studio:shell_language_ja}}</option>
      <option value="en" lang="en">{{t:presence_studio:shell_language_en}}</option>
    </select>
  </label>
</div>
